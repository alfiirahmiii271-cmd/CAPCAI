
services:
  cap-server:
    image: tiago2/cap:latest
    container_name: cap-server
    ports:
      - "3000:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?Isi CAP_ADMIN_KEY pada file .env}
      REDIS_URL: redis://valkey:6379
      ENABLE_ASSETS_SERVER: "true"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-alpine
    container_name: cap-valkey
    volumes:
      - valkey-data:/data
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  my-app:
    build: .
    container_name: my-app
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CAP_SERVER_URL: http://cap-server:3000
      CAP_WIDGET_BASE_URL: ${CAP_WIDGET_BASE_URL:-http://localhost:3000}
      CAP_SITE_KEY: ${CAP_SITE_KEY:-69083029a7}
      CAP_SECRET_KEY: ${CAP_SECRET_KEY:?Isi CAP_SECRET_KEY pada file .env}
    depends_on:
      - cap-server
    restart: unless-stopped

  cap-dashboard:
    build:
      context: ./cap-dashboard
      dockerfile: Dockerfile
    container_name: cap-dashboard
    ports:
      - "8000:8000"
    env_file:
      - ./cap-dashboard/.env
    environment:
      CAP_URL: http://cap-server:3000
    depends_on:
      - cap-server
    restart: unless-stopped

volumes:
  valkey-data:
